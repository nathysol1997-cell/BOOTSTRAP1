
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Design Workshop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f6f8;
        }

        .workshop-header {
            background: linear-gradient(to bottom, #484848, #292929);
        }

        .details-card, .register-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            font-weight: 600;
        }

        .workshop-info {
            margin-bottom: 18px;
        }

        .workshop-info p:first-child {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .workshop-info p:last-child {
            margin-bottom: 0;
        }

        @media (max-width: 576px) {
            .workshop-header h1 {
                font-size: 32px !important;
            }

            .content-area {
                margin: 0 15px !important;
            }

            .workshop-header .header-content {
                padding-left: 25px !important;
            }
        }
    </style>
</head>

<body>

    <div>

        <div class="row">
            <div class="col-12 workshop-header" style="height: 230px;">

                <div class="header-content pt-4" style="padding-left: 100px; margin: 0 15px;">

                    <span class="badge mb-2"
                        style="background-color: #ffc107; color: black; padding: 5px 9px;">
                        Free workshop
                    </span>

                    <h1 style="color: white; font-size: 46px; font-weight: 700; margin-bottom: 8px;">
                        Web Design Workshop
                    </h1>

                    <p style="color: white; font-size: 19px; font-weight: 300;">
                        Build your first responsive webpage with HTML and Bootstrap.
                    </p>

                </div>
            </div>
        </div>

        <div class="row py-4 content-area" style="margin: 0 100px;">

            <div class="col-12 col-sm-5 mb-3 mb-sm-0" style="padding-top: 12px;">

                <div class="card details-card">
                    <div class="card-body p-4">

                        <h4 class="card-title mb-3">
                            Workshop details
                        </h4>

                        <div class="workshop-info">
                            <p>Day</p>
                            <p>Saturday</p>
                        </div>

                        <div class="workshop-info">
                            <p>Location</p>
                            <p>School computer lab</p>
                        </div>

                        <div class="workshop-info">
                            <p>What to bring</p>
                            <p>A laptop and charger</p>
                        </div>

                    </div>
                </div>

            </div>

            <div class="col-12 col-sm-7" style="padding-top: 12px;">

                <div class="card register-card">
                    <div class="card-body p-4">

                        <h4 class="card-title mb-3">
                            Register for a session
                        </h4>

                        <form action="#">

                            <div class="mb-3">

                                <label for="fullName" class="form-label">
                                    Full name
                                </label>

                                <input type="text" class="form-control"
                                    id="fullName"  required>

                            </div>

                            <div class="mb-3">

                                <label for="emailAddress" class="form-label">
                                    Email address
                                </label>

                                <input type="email" class="form-control"
                                    id="emailAddress"  required>

                            </div>

                            <fieldset class="mb-4">

                                <legend class="fs-6" style="font-weight: 600;">
                                    Choose a session
                                </legend>

                                <div class="form-check mb-2">

                                    <input class="form-check-input" type="radio"
                                        name="session" id="morningSession"
                                        value="morning" required>

                                    <label class="form-check-label" for="morningSession">
                                        Morning · 9:00–11:00 AM
                                    </label>

                                </div>

                                <div class="form-check">

                                    <input class="form-check-input" type="radio"
                                        name="session" id="afternoonSession"
                                        value="afternoon" required>

                                    <label class="form-check-label" for="afternoonSession">
                                        Afternoon · 2:00–4:00 PM
                                    </label>

                                </div>

                            </fieldset>

                            <button type="submit" class="btn btn-primary px-4">
                                Register
                            </button>

                            <p class="form-text mt-3 mb-0">
                                Practice form. Entries are discarded.
                            </p>

                        </form>

                    </div>
                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
